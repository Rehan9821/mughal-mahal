<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Outer Rim Metallic Gold Gradients -->
    <linearGradient id="goldRimOuter" x1="15%" y1="10%" x2="85%" y2="90%">
      <stop offset="0%" stop-color="#fae7a5"/>
      <stop offset="25%" stop-color="#e2b85e"/>
      <stop offset="50%" stop-color="#9a7126"/>
      <stop offset="75%" stop-color="#e9c26c"/>
      <stop offset="100%" stop-color="#8a611c"/>
    </linearGradient>

    <linearGradient id="goldRimMid" x1="85%" y1="15%" x2="15%" y2="85%">
      <stop offset="0%" stop-color="#ffd97d"/>
      <stop offset="35%" stop-color="#a87c2c"/>
      <stop offset="70%" stop-color="#fae29c"/>
      <stop offset="100%" stop-color="#7a5518"/>
    </linearGradient>

    <!-- Deep Royal Crimson / Burgundy Center Radial Gradient -->
    <radialGradient id="burgundyBg" cx="50%" cy="45%" r="52%">
      <stop offset="0%" stop-color="#780b18"/>
      <stop offset="35%" stop-color="#5a0410"/>
      <stop offset="70%" stop-color="#3b0209"/>
      <stop offset="100%" stop-color="#240005"/>
    </radialGradient>

    <!-- Soft Dome & Flourish Gold Gradient -->
    <linearGradient id="goldAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff1c4"/>
      <stop offset="45%" stop-color="#deb45d"/>
      <stop offset="100%" stop-color="#a47a28"/>
    </linearGradient>

    <!-- Drop Shadow for Dimensionality -->
    <filter id="badgeGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="10" flood-color="#000000" flood-opacity="0.65"/>
      <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#c5a059" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Group for entire Circular Medallion -->
  <g filter="url(#badgeGlow)">
    <!-- 1. Outer Broad Gold Ring Base -->
    <circle cx="250" cy="250" r="236" fill="url(#goldRimOuter)" stroke="#4d340b" stroke-width="1.5"/>

    <!-- 2. Dark Separator Ring Groove -->
    <circle cx="250" cy="250" r="226" fill="none" stroke="#1f1103" stroke-width="2.5"/>

    <!-- 3. Inner Polished Gold Ring -->
    <circle cx="250" cy="250" r="221" fill="none" stroke="url(#goldRimMid)" stroke-width="4.5"/>

    <!-- 4. Deep Royal Crimson / Burgundy Circular Center with Bevel -->
    <circle cx="250" cy="250" r="214" fill="url(#burgundyBg)" stroke="#160103" stroke-width="2"/>

    <!-- Delicate Inner Bevel Highlight Line -->
    <circle cx="250" cy="250" r="212" fill="none" stroke="#a31422" stroke-width="1" opacity="0.45"/>
  </g>

  <!-- ================= TOP MUGHAL ARCH & MINARETS EMBLEM ================= -->
  <g transform="translate(0, -1)" fill="url(#goldAccent)">
    <!-- Central Dome with Pinnacle (Kalash) -->
    <!-- Pinnacle Spear -->
    <path d="M250 82 L252 92 L250 95 L248 92 Z"/>
    <circle cx="250" cy="98" r="2.8"/>
    <path d="M250 102 C255 106 261 114 261 124 C261 135 256 142 250 146 C244 142 239 135 239 124 C239 114 245 106 250 102 Z"/>

    <!-- Outer Arch Vault Structure -->
    <path d="M250 105 
             C258 111 270 125 270 148 
             L270 178 L261 178 L261 150 
             C261 133 252 121 247 116 
             C242 121 233 133 233 150 
             L233 178 L224 178 L224 148 
             C224 125 236 111 250 105 Z"/>

    <!-- Inner Arch Inset -->
    <path d="M250 118 
             C254 123 260 134 260 148 
             L260 178 L254 178 L254 150 
             C254 138 248 128 245 125 
             C242 128 236 138 236 150 
             L236 178 L230 178 L230 148 
             C230 134 236 123 250 118 Z" opacity="0.85"/>

    <!-- Left Minaret Pillar -->
    <rect x="194" y="142" width="7" height="36" rx="1"/>
    <!-- Left Minaret Balcony / Cupola -->
    <path d="M192 142 L203 142 L200 137 L195 137 Z"/>
    <path d="M197.5 124 C199 127 202 131 202 136 L193 136 C193 131 196 127 197.5 124 Z"/>
    <line x1="197.5" y1="120" x2="197.5" y2="124" stroke="url(#goldAccent)" stroke-width="1.8"/>

    <!-- Right Minaret Pillar -->
    <rect x="299" y="142" width="7" height="36" rx="1"/>
    <!-- Right Minaret Balcony / Cupola -->
    <path d="M297 142 L308 142 L305 137 L300 137 Z"/>
    <path d="M302.5 124 C304 127 307 131 307 136 L298 136 C298 131 301 127 302.5 124 Z"/>
    <line x1="302.5" y1="120" x2="302.5" y2="124" stroke="url(#goldAccent)" stroke-width="1.8"/>

    <!-- Flanking Architectural Buttresses -->
    <polygon points="208,178 214,178 214,158 208,168"/>
    <polygon points="286,178 292,178 292,168 286,158"/>

    <!-- Horizontal Arch Flanking Baseline Wings -->
    <line x1="84" y1="174" x2="182" y2="174" stroke="url(#goldAccent)" stroke-width="2" stroke-linecap="round"/>
    <line x1="318" y1="174" x2="416" y2="174" stroke="url(#goldAccent)" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- ================= SUB-HEADER: "Serving Since 1976" ================= -->
  <text x="250" y="210" 
        text-anchor="middle" 
        font-family="'Montserrat', 'Century Gothic', -apple-system, sans-serif" 
        font-size="22" 
        font-weight="700" 
        letter-spacing="0.5" 
        fill="#ffffff">
    Serving Since 1976
  </text>

  <!-- ================= MAIN WORDMARK: "mughal mahal" ================= -->
  <!-- Crisp, exact bold lowercase lettering with custom terminals matching the brand mark -->
  <g fill="#ffffff">
    <text x="250" y="280" 
          text-anchor="middle" 
          font-family="'Comfortaa', 'Fredoka', 'Montserrat', -apple-system, sans-serif" 
          font-size="60" 
          font-weight="700" 
          letter-spacing="-0.5">
      mughal mahal
    </text>
  </g>

  <!-- ================= BOTTOM ORNAMENT: ROYAL LOTUS FLOURISH & SEPARATOR ================= -->
  <g transform="translate(0, 318)" fill="url(#goldAccent)" stroke="url(#goldAccent)">
    <!-- Left Thin Accent Divider Line -->
    <line x1="96" y1="6" x2="216" y2="6" stroke-width="1.8" stroke-linecap="round"/>
    <!-- Right Thin Accent Divider Line -->
    <line x1="284" y1="6" x2="404" y2="6" stroke-width="1.8" stroke-linecap="round"/>

    <!-- Central Mughal Floral Palmette / Fleur-de-Lis -->
    <!-- Center Upward Spear / Petal -->
    <path d="M250 -14 C252 -6 256 0 256 5 C256 9 253 11 250 11 C247 11 244 9 244 5 C244 0 248 -6 250 -14 Z" stroke-width="0.5"/>
    
    <!-- Left Curving Petal -->
    <path d="M250 8 C242 8 230 4 224 -5 C222 -8 226 -9 229 -7 C236 -2 243 4 250 8 Z" stroke-width="0.5"/>
    
    <!-- Right Curving Petal -->
    <path d="M250 8 C258 8 270 4 276 -5 C278 -8 274 -9 271 -7 C264 -2 257 4 250 8 Z" stroke-width="0.5"/>

    <!-- Bottom Drop Accent Pearl -->
    <circle cx="250" cy="19" r="3.6" stroke-width="0"/>
    <circle cx="250" cy="27" r="1.8" stroke-width="0"/>
  </g>
</svg>
